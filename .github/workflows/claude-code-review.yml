name: Claude Code Review

# Quality gate: fails when Claude finds a blocking correctness/security problem (or produces no verdict).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REPORT FILE: ${{ runner.temp }}/code-review.md

            Review this pull request for correctness bugs, security problems and missing tests.
            Get the diff with `gh pr diff` / `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            and read the changed files. Use inline comments for specific lines.

            Then WRITE the summary (under ~250 words, concrete, cite file:line, no praise filler) to the
            REPORT FILE with the Write tool. Its LAST line must be exactly one of:
              VERDICT: PASS   (no blocking issues; nits and suggestions are fine)
              VERDICT: FAIL   (at least one correctness bug, security problem, data-loss risk, or broken
                               project rule below that should block the merge)
            Do not post the summary yourself; the workflow posts the file.

            Project rules (see CLAUDE.md / AGENTS.md):
            - Do NOT flag the intentional course behavior: simulated latency, FlakyHeartbeatJob,
              GET /api/debug/boom, flake-*.spec.ts, CORS *, hardcoded JWT secret and admin credentials.
            - Every schema change needs a new Flyway migration (never edit an applied one); JPA uses ddl-auto=validate.
            - New DTOs with an image URL must be added to ImageUrlResponseAdvice.
            - E2E specs: no fixed waits (waitForTimeout/setTimeout/sleep), role/label locators, a fresh customer per test,
              no changes to shared seed data, relative #/ routes in admin specs.
            - Keep ARIA labels and form names stable; bug-fix commits cite the ticket ID, e.g. (FM-BUG-07).
          claude_args: |
            --allowedTools "Write,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Check report
        id: report
        if: always()
        run: '[ -s "$RUNNER_TEMP/code-review.md" ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"'

      - name: Post Code review report
        if: always() && steps.report.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude-code-review
          path: ${{ runner.temp }}/code-review.md

      # Quality gate: fail closed. A missing report or verdict (including a skipped action) blocks the merge.
      - name: Quality gate
        if: always()
        run: |
          F="$RUNNER_TEMP/code-review.md"
          if [ ! -s "$F" ]; then
            echo "::error::No Code review report was produced, so the gate fails closed."; exit 1
          fi
          if grep -qE '^VERDICT: PASS\s*$' "$F"; then echo "Code review: PASS"; exit 0; fi
          echo "::error::Code review verdict is not PASS (see the PR comment)."; exit 1
