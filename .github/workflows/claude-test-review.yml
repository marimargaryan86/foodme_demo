name: Claude Test Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "apps/**/e2e/**"
      - "apps/backend/src/**"
      - "apps/web/src/**"
      - "apps/admin/src/**"
      - "tests/**"

concurrency:
  group: test-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-review:
    # Fork PRs get no secrets, so skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run test hook unit tests
        run: node --test "tests/hooks/*.test.mjs"
        continue-on-error: true

      - name: Review tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Review the TESTS in this PR (added, changed, and missing). Get the diff with
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` and read the full
            changed test files. Production-code bug review is done by claude-code-review.yml; stay on tests.

            Check against the repo's test rules in `.agents/rules/` (read them first):
            - `e2e-tests.md` + `admin-e2e.md` for specs in `apps/web/e2e/` and `apps/admin/e2e/`:
              no waitForTimeout/setTimeout/sleep (except flake-*.spec.ts, which must not be edited),
              getByRole/getByLabel/getByText not CSS classes, API-based setup, a fresh random customer per test,
              no changes to shared seed data or chefs/dishes, `{ timeout: 15000 }` on API-backed assertions,
              admin uses relative `#/` routes and clicks "Refresh" after API-created data.
            - `manual-test-cases.md` for `tests/*.md`: heading/metadata format, unique FM-TC-NN,
              expected results never rewritten to match the app, README index and case count in sync.
            - Backend tests (`apps/backend/src/test`): MockMvc on the `test` profile, H2 + data.sql;
              assert status AND body, cover the unhappy path (401/403/404/400), no dependence on test order.

            Also assess quality:
            1. Does each new/changed test actually assert the behavior it names (no vacuous or always-true assertions,
               no assertion-free tests, no over-mocking)?
            2. Flakiness risks: shared state, ordering, timing, unscoped locators, non-unique data.
            3. Coverage gaps: changed production code in this PR with no test. List the specific missing cases
               (happy path, validation, auth, edge) and which existing manual case in `tests/` covers it, if any.
            4. Duplicate or redundant tests.

            Do NOT flag intentional course behavior (simulated latency, FlakyHeartbeatJob, /api/debug/boom,
            flake-*.spec.ts, CORS *, hardcoded JWT secret/admin credentials).

            Output: use inline comments for specific test lines, and ONE summary comment via
            `gh pr comment --edit-last --create-if-none` with: verdict (Approve / Needs changes),
            rule violations, quality issues, and a prioritized list of missing tests. Under ~300 words,
            cite file:line, no praise filler. If the PR has no test-relevant changes, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
